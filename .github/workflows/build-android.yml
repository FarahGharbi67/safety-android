name: Build Safety Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect Gradle files
        run: |
          echo "=== Project root ==="
          ls -la
          echo "=== Gradle configuration files ==="
          find . -maxdepth 5 -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "gradlew" -o \
            -name "libs.versions.toml" \
          \)

      - name: Build APK
        run: |
          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew is missing from the repository root."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: safety-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
