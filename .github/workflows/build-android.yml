name: Build Safety Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect project
        run: |
          echo "Root files:"
          ls -la
          echo "Android source files:"
          find src -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          if [ ! -f gradlew ]; then
            echo "ERREUR: le wrapper Gradle est absent."
            echo "Il faut configurer le projet Gradle avant la compilation."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: safety-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
