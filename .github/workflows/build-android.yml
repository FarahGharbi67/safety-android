```yaml
name: Build Safety Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect project files
        run: |
          echo "=== Root directory ==="
          ls -la
          echo "=== Gradle files ==="
          find . -maxdepth 4 \( -name "settings.gradle*" -o -name "build.gradle*" -o -name "gradlew" -o -name "libs.versions.toml" \) -print

      - name: Build APK
        run: |
          if [ ! -f gradlew ]; then
            echo "ERREUR : gradlew est absent de la racine."
            echo "Impossible de compiler avant de configurer Gradle."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: safety-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

4. Clique sur **Commit changes** pour enregistrer.

## Étape 2 — Relancer GitHub Actions

1. Ouvre l'onglet **Actions**.
2. Sélectionne **Build Safety Android APK**.
3. Clique sur **Run workflow**.
4. Ouvre la nouvelle exécution et clique sur `build`.

### Que va-t-il se passer ?

Le workflow va rechercher les fichiers Gradle, puis tenter de compiler l'application.

- **Si la compilation réussit :** tu pourras télécharger l'APK dans la section `Artifacts`.
- **Si `gradlew` est absent :** le journal nous indiquera qu'il faut configurer le projet Gradle.
- **Si une autre erreur apparaît :** nous pourrons corriger la configuration correspondante.

