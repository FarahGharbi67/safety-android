name: Build Safety Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android repository
        uses: actions/checkout@v4

      - name: Checkout main project
        uses: actions/checkout@v4
        with:
          repository: andersontrkz/safety-iot
          path: safety-iot

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          echo "Android files:"
          ls -la
          echo "Main project files:"
          ls -la safety-iot

      - name: Build APK
        run: |
          echo "La configuration Gradle doit être vérifiée avant la compilation."
          exit 1
